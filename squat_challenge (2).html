<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Squat Squad</title>
<style>
  :root{
    --ink:#181A1B; --concrete:#EDEAE2; --concrete-dim:#D9D4C8;
    --power:#FF4B12; --steel:#3A5DFF; --green:#1F8A5C;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--ink);color:var(--concrete);min-height:100vh;-webkit-font-smoothing:antialiased;}
  #app{max-width:480px;margin:0 auto;padding:0 0 40px;}
  header{padding:28px 20px 22px;border-bottom:3px solid var(--power);position:relative;}
  header h1{font-size:34px;margin:0 0 4px;line-height:0.95;font-weight:900;letter-spacing:-0.02em;}
  header h1 span{color:var(--power);}
  header p{margin:0;color:var(--concrete-dim);font-size:14px;}
  .refresh{position:absolute;top:28px;right:20px;background:#232527;border:none;color:var(--concrete-dim);
    padding:8px 12px;border-radius:8px;font-size:12px;cursor:pointer;}
  .frontrunner{margin:18px 20px 0;background:linear-gradient(135deg,var(--power),#c93800);border-radius:14px;
    padding:16px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 6px 18px rgba(255,75,18,0.25);}
  .frontrunner .label{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;opacity:0.85;margin-bottom:2px;}
  .frontrunner .name{font-size:22px;font-weight:900;}
  .frontrunner .count{font-size:26px;font-weight:900;}
  section{margin:26px 20px 0;}
  .section-title{font-size:13px;color:var(--concrete-dim);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
  .toggle{display:flex;background:#232527;border-radius:999px;padding:4px;gap:4px;}
  .toggle button{flex:1;border:none;background:transparent;color:var(--concrete-dim);padding:9px 0;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;}
  .toggle button.active{background:var(--power);color:white;}
  .board{background:#212325;border-radius:14px;overflow:hidden;}
  .row{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid #2c2e30;gap:12px;}
  .row:last-child{border-bottom:none;}
  .rank{width:26px;font-weight:900;font-size:15px;color:var(--concrete-dim);flex-shrink:0;}
  .row.first .rank{color:var(--power);}
  .rowname{flex:1;font-weight:700;font-size:16px;}
  .rowbar{flex:1;height:8px;background:#33363a;border-radius:4px;overflow:hidden;margin:0 10px;}
  .rowbar-fill{height:100%;background:var(--power);border-radius:4px;transition:width .5s ease;}
  .rowcount{font-weight:900;font-size:16px;min-width:52px;text-align:right;}
  .goalcard{background:#212325;border-radius:14px;padding:16px;margin-bottom:10px;}
  .goalcard .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px;}
  .goalcard .top .who{font-weight:700;}
  .goalcard .top .prog{color:var(--concrete-dim);}
  .goaltrack{height:10px;background:#33363a;border-radius:5px;overflow:hidden;}
  .goalfill{height:100%;background:var(--steel);border-radius:5px;transition:width .5s ease;}
  .goalfill.done{background:var(--green);}
  .goalmeta{font-size:11px;color:var(--concrete-dim);margin-top:6px;}
  .monthgoal{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;}
  .monthgoal .mg-title{font-size:19px;font-weight:900;}
  .monthgoal .mg-target{font-size:13px;color:var(--concrete-dim);}
  .winners{display:flex;gap:10px;}
  .wincard{flex:1;background:#212325;border-radius:14px;padding:14px 10px;text-align:center;}
  .wincard .wm{font-size:11px;color:var(--concrete-dim);text-transform:uppercase;letter-spacing:.05em;}
  .wincard .wn{font-size:15px;font-weight:800;margin-top:6px;}
  .wincard.pending .wn{color:#5a5d61;}
  footer{text-align:center;padding:26px 20px 0;color:#5a5d61;font-size:12px;}
  .loading{display:flex;align-items:center;justify-content:center;height:100vh;color:var(--concrete-dim);}
  .err{margin:18px 20px 0;background:#3a1f1f;border:1px solid #6b2b2b;border-radius:10px;padding:14px;font-size:13px;color:#ffb3b3;}
</style>
</head>
<body>
<div id="loading" class="loading">Loading squad…</div>
<div id="app" style="display:none;"></div>

<script>
// ====== CONFIG: paste your Apps Script Web App URL here ======
const API_URL = "https://script.google.com/macros/s/AKfycbzvq8Q0C6H4GNNfaOnnVWYiGU2HgkMXtChX3diGp3TzS1zNjhR_KIKLuZpugXwCQOih/exec";
// ================================================================

const GOALS = { "2026-09": 1000, "2026-10": 1500, "2026-11": 2000 };
const MONTH_LABELS = { "2026-09": "September", "2026-10": "October", "2026-11": "November" };
const NAMES = ["Mia","Connor","Ryan","Jocelyn"];

let entries = [];
let selectedMonth = null; // set on first render to current month
let loadError = null;
const MONTH_ORDER = ["2026-09","2026-10","2026-11"];

async function loadEntries(){
  loadError = null;
  try{
    const res = await fetch(API_URL + "?action=list");
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || "unknown error");
    entries = data.entries || [];
  }catch(e){
    console.error(e);
    loadError = "Couldn't load the latest data. Check your connection and hit refresh.";
  }
}

function todayISO(){ return new Date().toISOString().slice(0,10); }
function monthKey(d){ return d.slice(0,7); }
function startOfWeek(d){
  const dt = new Date(d+"T00:00:00");
  const day = dt.getDay();
  const diff = (day===0?-6:1)-day;
  dt.setDate(dt.getDate()+diff);
  return dt.toISOString().slice(0,10);
}

function monthTotals(mKey){
  const totals = {}; NAMES.forEach(n=>totals[n]=0);
  entries.forEach(e=>{ if(monthKey(e.date)===mKey && e.user in totals) totals[e.user]+=Number(e.amount); });
  return totals;
}
function winnerOf(totals){
  let best=null,bestVal=-1;
  for(const n in totals){ if(totals[n]>bestVal){bestVal=totals[n];best=n;} }
  return bestVal>0?best:null;
}

function render(){
  const today = todayISO();
  const curMonth = monthKey(today);
  if(!selectedMonth){
    // default to the current real-world month, clamped into the tracked range
    selectedMonth = MONTH_ORDER.includes(curMonth) ? curMonth : (curMonth < MONTH_ORDER[0] ? MONTH_ORDER[0] : MONTH_ORDER[MONTH_ORDER.length-1]);
  }
  const isSelectedCurrent = selectedMonth === curMonth;
  const isSelectedPast = selectedMonth < curMonth;

  const monthData = monthTotals(selectedMonth);
  const leader = winnerOf(monthData);
  const sorted = Object.entries(monthData).sort((a,b)=>b[1]-a[1]);
  const maxVal = Math.max(1, ...sorted.map(s=>s[1]));
  const monthGoalTarget = GOALS[selectedMonth];
  const combinedMonthTotal = Object.values(monthData).reduce((a,b)=>a+b,0);

  let html = `<header><h1>SQUAT<span>SQUAD</span></h1><p>Tracking every rep. Sept 1,000 → Oct 1,500 → Nov 2,000.</p>
    <button class="refresh" id="refreshBtn">Refresh</button></header>`;

  if(loadError){ html += `<div class="err">${loadError}</div>`; }

  if(leader){
    html += `<div class="frontrunner"><div><div class="label">${isSelectedCurrent ? "Current front-runner" : (isSelectedPast ? MONTH_LABELS[selectedMonth]+" winner" : "Leader")}</div>
      <div class="name">${leader}</div></div><div class="count">${monthData[leader]}</div></div>`;
  }

  html += `<section><div class="section-title"><span>${MONTH_LABELS[selectedMonth]} leaderboard</span></div>
    <div class="toggle" id="toggle">`;
  MONTH_ORDER.forEach(mk=>{
    html += `<button data-v="${mk}" class="${selectedMonth===mk?'active':''}">${MONTH_LABELS[mk].slice(0,3)}</button>`;
  });
  html += `</div></section>`;

  html += `<section><div class="board">`;
  sorted.forEach(([name,val],i)=>{
    html += `<div class="row ${i===0?'first':''}"><div class="rank">${i+1}</div>
      <div class="rowname">${name}</div>
      <div class="rowbar"><div class="rowbar-fill" style="width:${(val/maxVal*100).toFixed(0)}%"></div></div>
      <div class="rowcount">${val}</div></div>`;
  });
  html += `</div></section>`;

  html += `<section><div class="monthgoal"><div class="mg-title">${MONTH_LABELS[selectedMonth]} goal</div>
    <div class="mg-target">${combinedMonthTotal} / ${monthGoalTarget*NAMES.length} combined</div></div>`;
  NAMES.forEach(n=>{
    const val = monthData[n]||0;
    const pct = Math.min(100,(val/monthGoalTarget*100));
    const done = val>=monthGoalTarget;
    html += `<div class="goalcard"><div class="top"><span class="who">${n}</span><span class="prog">${val} / ${monthGoalTarget}</span></div>
      <div class="goaltrack"><div class="goalfill ${done?'done':''}" style="width:${pct}%"></div></div>
      <div class="goalmeta">${done?"Goal hit! 🎉":(monthGoalTarget-val)+" to go"}</div></div>`;
  });
  html += `</section>`;

  html += `<section><div class="section-title"><span>Monthly winners</span></div><div class="winners">`;
  MONTH_ORDER.forEach(mk=>{
    const isPast = mk<curMonth, isCurrent = mk===curMonth;
    let winnerName="—";
    if(isPast){ winnerName = winnerOf(monthTotals(mk)) || "No entries"; }
    else if(isCurrent){ winnerName = winnerOf(monthTotals(curMonth)) || "In progress"; }
    html += `<div class="wincard ${!isPast&&!isCurrent?'pending':''}" data-jump="${mk}"><div class="wm">${MONTH_LABELS[mk].slice(0,3)}</div>
      <div class="wn">${winnerName}</div></div>`;
  });
  html += `</div></section>`;
  html += `<footer>This is the shared leaderboard view. Each of you logs squats from your own personal link. Past months stay viewable here even after the counter moves on.</footer>`;

  document.getElementById('app').innerHTML = html;
  document.querySelectorAll('#toggle button').forEach(b=>{ b.onclick=()=>{selectedMonth=b.dataset.v;render();}; });
  document.querySelectorAll('.wincard').forEach(b=>{ b.onclick=()=>{selectedMonth=b.dataset.jump;render();}; b.style.cursor='pointer'; });
  document.getElementById('refreshBtn').onclick = refresh;
}

async function refresh(){
  document.getElementById('loading').style.display='flex';
  document.getElementById('app').style.display='none';
  await loadEntries();
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='block';
  render();
}

refresh();
setInterval(refresh, 30000); // auto-refresh every 30s so everyone sees live progress
</script>
</body>
</html>
